name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          # Optional: Cloudflare Workers endpoint for LINE push notifications.
          # Set as a repo Variable (Settings → Secrets and variables → Actions
          # → Variables) so you don't have to bake the URL into source.
          # When unset the build still succeeds; the LINE notify UI is
          # simply hidden at runtime.
          NEXT_PUBLIC_LINE_NOTIFY_URL: ${{ vars.NEXT_PUBLIC_LINE_NOTIFY_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
